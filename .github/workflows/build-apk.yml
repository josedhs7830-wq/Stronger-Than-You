name: stronger-than-you
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - name: Forzar orientacion horizontal
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/<activity /<activity android:screenOrientation="sensorLandscape" /' $M
      - name: Icono de la app (corazon)
        run: |
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          CV=$(command -v magick || command -v convert)
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}; s=${pair##*:}; i=$((s*72/100))
            $CV www/icon-256.png -background black -alpha remove -alpha off -filter point -resize ${i}x${i} -gravity center -extent ${s}x${s} $R/mipmap-$d/ic_launcher.png
            cp $R/mipmap-$d/ic_launcher.png $R/mipmap-$d/ic_launcher_round.png
            cp $R/mipmap-$d/ic_launcher.png $R/mipmap-$d/ic_launcher_foreground.png
          done
      - run: npx cap sync android
      - name: stronger-than-you
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: stronger-than-you-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
