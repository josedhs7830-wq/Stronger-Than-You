<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.json">
  <script>(function(){var d=window.devicePixelRatio||1;try{Object.defineProperty(window,"devicePixelRatio",{get:function(){return Math.min(d,1.5)},configurable:true});}catch(e){}})();</script>

	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
	<title>Stronger Than You</title>

    <!-- All margins and padding must be zero for the canvas to fill the screen. -->
	<style type="text/css">
		* {
			padding: 0;
			margin: 0;
		}
		html, body {
			background: #000;
			color: #fff;
			overflow: hidden;
			touch-action-delay: none;
			touch-action: none;
			-ms-touch-action: none;
		}
		canvas {
			touch-action-delay: none;
			touch-action: none;
			-ms-touch-action: none;
		}
    
    html,body{height:100%;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
    :root{--b:min(21vmin,104px);--jb:min(40vmin,200px)}
    #pad{position:fixed;inset:0;pointer-events:none;z-index:50;display:none}
    #pad.on{display:block}
    .tb{position:absolute;display:flex;align-items:center;justify-content:center;color:#fff;font:bold 26px sans-serif;
        background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.45);border-radius:50%;
        width:var(--b);height:var(--b);user-select:none;-webkit-user-select:none;touch-action:none}
    .tb.down{background:rgba(255,200,0,.55);border-color:#ffd000}
    #btnzone{position:absolute;left:0;top:25%;width:42%;bottom:0;pointer-events:auto;touch-action:none}
    #acts{position:absolute;left:calc(env(safe-area-inset-left,0px) + 3vmin);bottom:calc(env(safe-area-inset-bottom,0px) + 4vmin);
          width:calc(var(--b)*2.3);height:calc(var(--b)*2.1);pointer-events:none}
    #acts .tb{pointer-events:none}
    #acts .z{right:0;top:0}
    #acts .x{left:0;bottom:0}
    #acts .sh{--b:min(12vmin,56px);left:0;top:0;font-size:15px;opacity:.85}
    #stickzone{position:absolute;right:0;top:20%;width:44%;bottom:0;pointer-events:auto;touch-action:none}
    #sbase{position:absolute;left:0;top:0;width:var(--jb);height:var(--jb);margin:calc(var(--jb)/-2) 0 0 calc(var(--jb)/-2);
           border-radius:50%;background:rgba(255,255,255,.10);border:2px solid rgba(255,255,255,.4);pointer-events:none;opacity:.5;will-change:transform}
    #sbase.act{opacity:1;background:rgba(255,255,255,.18)}
    #sknob{position:absolute;left:50%;top:50%;width:44%;height:44%;margin:-22% 0 0 -22%;border-radius:50%;
           background:rgba(255,255,255,.5);border:2px solid #fff;will-change:transform}
    #top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 6px);right:calc(env(safe-area-inset-right,0px) + 8px);display:flex;gap:4px;pointer-events:none}
    #top .tb{position:relative;--b:40px;width:40px;border-radius:14px;font-size:16px;opacity:.7;pointer-events:auto}
    #top .tb::after{content:"";position:absolute;inset:-8px}
    #rot,#go{position:fixed;inset:0;z-index:99;background:#000;color:#fff;display:none;align-items:center;justify-content:center;
         text-align:center;font:20px sans-serif;padding:24px;line-height:1.5}
    #go{display:flex;z-index:98;flex-direction:column;cursor:pointer}
    #go b{font-size:30px;display:block;margin-bottom:10px}
    @media (orientation:portrait){#rot{display:flex}}
</style>
	

</head> 
 
<body> 
	<div id="fb-root"></div>
  <div id="rot">📱↻<br><br>Gira el celular en horizontal<br>Rotate your phone to landscape</div>
  <div id="go"><b>STRONGER THAN YOU</b>Toca para jugar<br><small style="opacity:.6">Tap to play</small></div>
  <div id="pad">
    <div id="btnzone"></div>
    <div id="acts">
      <div class="tb sh" data-k="Shift">⇧</div>
      <div class="tb z" data-k="z">Z</div>
      <div class="tb x" data-k="x">X</div>
    </div>
    <div id="stickzone"><div id="sbase"><div id="sknob"></div></div></div>
    <div id="top">
      <div class="tb" id="bc" data-k="c">C</div>
      <div class="tb" id="fsbtn">⛶</div>
      <div class="tb" id="padbtn">🎮</div>
    </div>
  </div>

	
	<!-- The canvas must be inside a div called c2canvasdiv -->
	<div id="c2canvasdiv">
	
		<!-- The canvas the project will render to.  If you change its ID, don't forget to change the
		ID the runtime looks for in the jQuery events above (ready() and cr_sizeCanvas()). -->
		<canvas id="c2canvas" width="960" height="560"></canvas>
		
	</div>
	
	<!-- For node-webkit to show file dialogs -->
	<input style="display:none;" id="c2nwOpenFileDialog" type="file" />
	<input style="display:none;" id="c2nwChooseFolderDialog" type="file" nwdirectory />
	<input style="display:none;" id="c2nwSaveDialog" type="file" nwsaveas />
	
	<!-- Pages load faster with scripts at the bottom -->
	
	<!-- Construct 2 exported games require jQuery. -->
	<script src="jquery-3.4.1.min.js"></script>


	
    <!-- The runtime script.  You can rename it, but don't forget to rename the reference here as well.
    This file will have been minified and obfuscated if you enabled "Minify script" during export. -->
	<script src="c2runtime.js"></script>

    <script>
  jQuery(document).ready(function(){ cr_createRuntime("c2canvas"); });
  function onVisibilityChanged(){ if(document.hidden||document.webkitHidden) cr_setSuspended(true); else cr_setSuspended(false); }
  document.addEventListener("visibilitychange",onVisibilityChanged,false);
  document.addEventListener("webkitvisibilitychange",onVisibilityChanged,false);
</script>

  <script>
  (function(){
    var $=function(id){return document.getElementById(id)};
    var pad=$('pad'), btnzone=$('btnzone'), stickzone=$('stickzone'), base=$('sbase'), knob=$('sknob');
    var KC={ArrowUp:38,ArrowDown:40,ArrowLeft:37,ArrowRight:39,z:90,x:88,c:67,Enter:13,Shift:16,Control:17};
    // Envia una tecla "de teclado" al juego (Construct 2 las lee con jQuery sobre document)
    function fire(type,k){
      var code=KC[k], e=new KeyboardEvent(type,{key:k,bubbles:true,cancelable:true});
      Object.defineProperty(e,'keyCode',{get:function(){return code}});
      Object.defineProperty(e,'which',{get:function(){return code}});
      document.dispatchEvent(e);
    }
    var held={}, since={}, MIN_HOLD=50;
    function setKey(k,down){
      if(!!held[k]===down) return;
      if(down){ held[k]=true; since[k]=performance.now(); fire('keydown',k); }
      else{
        held[k]=false; var wait=MIN_HOLD-(performance.now()-since[k]);
        if(wait>0) setTimeout(function(){ if(!held[k]) fire('keyup',k); },wait); else fire('keyup',k);
      }
    }
    function press(el,down){
      if(!!el._d===down) return; el._d=down; el.classList.toggle('down',down);
      setKey(el.dataset.k,down);
      if(down && navigator.vibrate) try{navigator.vibrate(6)}catch(e){}
    }
    // ----- Botones (izquierda), deteccion por cercania -----
    var MARGIN=26, rects=[];
    function calcBtns(){ rects=[].slice.call(document.querySelectorAll('#acts .tb')).map(function(el){
      var r=el.getBoundingClientRect(); return {el:el,cx:(r.left+r.right)/2,cy:(r.top+r.bottom)/2,r:r.width/2}; }); }
    function nearest(x,y){ var b=null,bd=1e9; for(var i=0;i<rects.length;i++){ var o=rects[i], d=Math.hypot(x-o.cx,y-o.cy)-o.r; if(d<bd){bd=d;b=o.el;} } return bd<=MARGIN?b:null; }
    var own={};
    btnzone.addEventListener('pointerdown',function(e){ e.preventDefault(); var b=nearest(e.clientX,e.clientY); if(!b) return;
      try{btnzone.setPointerCapture(e.pointerId)}catch(_){} own[e.pointerId]=b; press(b,true); },{passive:false});
    btnzone.addEventListener('pointermove',function(e){ var cur=own[e.pointerId]; if(!cur) return; var b=nearest(e.clientX,e.clientY);
      if(b!==cur){ press(cur,false); if(b){ own[e.pointerId]=b; press(b,true);} else delete own[e.pointerId]; } });
    function bUp(e){ var b=own[e.pointerId]; if(b){ press(b,false); delete own[e.pointerId]; } }
    btnzone.addEventListener('pointerup',bUp); btnzone.addEventListener('pointercancel',bUp);
    var bc=$('bc');
    bc.addEventListener('pointerdown',function(e){ e.preventDefault(); try{bc.setPointerCapture(e.pointerId)}catch(_){} press(bc,true); },{passive:false});
    function cUp(){ press(bc,false); } bc.addEventListener('pointerup',cUp); bc.addEventListener('pointercancel',cUp);
    // ----- Joystick flotante (derecha) -----
    var sid=null,cx=0,cy=0,R=80,zr={left:0,top:0,w:0,h:0},px=0,py=0,raf=0;
    var dirs={ArrowUp:false,ArrowDown:false,ArrowLeft:false,ArrowRight:false};
    function cacheStick(){ var r=stickzone.getBoundingClientRect(); zr={left:r.left,top:r.top,w:r.width,h:r.height}; R=Math.max(40,base.offsetWidth/2); }
    function restPos(){ base.style.transform='translate('+(zr.w-R-Math.max(16,zr.w*0.06))+'px,'+(zr.h-R-Math.max(16,zr.h*0.06))+'px)'; }
    function draw(){ raf=0; knob.style.transform='translate('+px+'px,'+py+'px)'; base.style.transform='translate('+(cx-zr.left)+'px,'+(cy-zr.top)+'px)'; }
    function queue(){ if(!raf) raf=requestAnimationFrame(draw); }
    function applyDirs(dx,dy){
      var dz=R*0.16, ax=Math.abs(dx), ay=Math.abs(dy), maj=Math.max(ax,ay);
      var okX=ax>dz&&ax>=maj*0.36, okY=ay>dz&&ay>=maj*0.36;
      var want={ArrowRight:okX&&dx>0,ArrowLeft:okX&&dx<0,ArrowDown:okY&&dy>0,ArrowUp:okY&&dy<0};
      for(var k in want){ if(want[k]!==dirs[k]){ dirs[k]=want[k]; setKey(k,want[k]); } }
    }
    function moveStick(x,y){
      var dx=x-cx, dy=y-cy, dist=Math.hypot(dx,dy), max=R*0.85;
      if(dist>max){ var k=(dist-max)/dist; cx+=dx*k; cy+=dy*k; dx=x-cx; dy=y-cy; }
      px=dx; py=dy; applyDirs(dx,dy); queue();
    }
    stickzone.addEventListener('pointerdown',function(e){ if(sid!==null) return; e.preventDefault(); sid=e.pointerId;
      try{stickzone.setPointerCapture(sid)}catch(_){} cx=e.clientX; cy=e.clientY; base.classList.add('act'); px=py=0; moveStick(e.clientX,e.clientY); },{passive:false});
    stickzone.addEventListener('pointermove',function(e){ if(e.pointerId===sid) moveStick(e.clientX,e.clientY); });
    function sEnd(e){ if(e.pointerId!==sid) return; sid=null; px=py=0; base.classList.remove('act'); applyDirs(0,0);
      if(raf){cancelAnimationFrame(raf);raf=0;} knob.style.transform=''; restPos(); }
    stickzone.addEventListener('pointerup',sEnd); stickzone.addEventListener('pointercancel',sEnd);
    // ----- UI -----
    function layout(){ calcBtns(); cacheStick(); if(sid===null) restPos(); }
    window.addEventListener('resize',layout); window.addEventListener('orientationchange',function(){setTimeout(layout,250)});
    window.addEventListener('blur',function(){ [].forEach.call(document.querySelectorAll('.tb.down'),function(b){press(b,false)}); applyDirs(0,0); });
    var visible=true;
    $('padbtn').addEventListener('click',function(){ visible=!visible; btnzone.style.display=stickzone.style.display=$('acts').style.display=visible?'':'none'; if(visible) layout(); });
    function fs(){
      try{ var el=document.documentElement; if(!document.fullscreenElement){ var f=el.requestFullscreen||el.webkitRequestFullscreen; if(f) f.call(el); } else document.exitFullscreen(); }catch(e){}
      try{ screen.orientation.lock('landscape').catch(function(){}); }catch(e){}
      setTimeout(layout,300);
    }
    $('fsbtn').addEventListener('click',fs);
    $('go').addEventListener('click',function(){ $('go').style.display='none'; pad.classList.add('on'); layout(); fs();
      try{ navigator.wakeLock&&navigator.wakeLock.request('screen').catch(function(){}); }catch(e){} });
    document.addEventListener('contextmenu',function(e){e.preventDefault()});
    document.addEventListener('gesturestart',function(e){e.preventDefault()});
    window.__pad={setKey:setKey,layout:layout};
  })();
  </script>
</body> 
</html>
